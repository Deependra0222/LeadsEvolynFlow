[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  included_files = ["netlify/data/initial-leads.json"]

[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/lead-data/admin/:splat"
  status = 200

[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/lead-data"
  status = 200

[[redirects]]
  from = "/api/leads/*"
  to = "/.netlify/functions/lead-data/:splat"
  status = 200

[[redirects]]
  from = "/api/compartments"
  to = "/.netlify/functions/lead-data/compartments"
  status = 200
